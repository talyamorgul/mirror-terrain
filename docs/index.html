<style>
/* Layout: dark mission band on top; explorer = controls | map | detail; other views are reading columns. Two worlds: Mars rust above, Earth blue below. */
:root {
  --bg: #f5f2f0; --surface: #fffdfb; --sunk: #ece6e3; --ink: #24171b; --muted: #6b5c60; --line: #ddd2cf;
  --band: #3b0d11; --band-ink: #f6e3cf; --band-muted: #d9b8a4;
  --mars: #b4462a; --mars-soft: #f3d9cc; --earth: #33478a; --earth-soft: #dde2f3; --accent: #c45a1f;
  --good: #2f7a4a; --warn: #a76a00; --bad: #a3322c;
  --display: "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #130b0e; --surface: #1d1317; --sunk: #281b20; --ink: #f1e6e1; --muted: #b5a3a7; --line: #3a2a30;
  --band: #2a080b; --band-ink: #f6e3cf; --band-muted: #c7a08d;
  --mars: #e5794a; --mars-soft: #3d1d17; --earth: #9aaee8; --earth-soft: #1f2645; --accent: #f08a4b;
  --good: #6cc48c; --warn: #e2b04a; --bad: #ef7a72; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #130b0e; --surface: #1d1317; --sunk: #281b20; --ink: #f1e6e1; --muted: #b5a3a7; --line: #3a2a30;
  --band: #2a080b; --band-ink: #f6e3cf; --band-muted: #c7a08d;
  --mars: #e5794a; --mars-soft: #3d1d17; --earth: #9aaee8; --earth-soft: #1f2645; --accent: #f08a4b;
  --good: #6cc48c; --warn: #e2b04a; --bad: #ef7a72; color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); margin: 0; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { font-family: var(--body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
a { color: var(--earth); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .01em; text-wrap: balance; line-height: 1.15; margin: 0; }
h2 { font-size: 1.6rem; } h3 { font-size: 1.12rem; }
.num, td.n, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- top band ---------- */
.band { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1000; background: var(--band); color: var(--band-ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.band-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-block: 10px; max-width: 1600px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand .logo { width: 40px; height: 40px; flex: none; align-self: center; display: block; }
.brand .logo svg { width: 100%; height: 100%; display: block; }
.brand h1 { font-size: 1.5rem; letter-spacing: .12em; text-transform: uppercase; color: var(--band-ink); }
.brand .split { color: var(--band-muted); font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 2px; flex: 1 1 auto; }
nav.tabs a { color: var(--band-muted); text-decoration: none; font-size: .9rem; padding: 6px 10px; border-radius: var(--r); white-space: nowrap; }
nav.tabs a:hover { color: var(--band-ink); background: rgba(255,255,255,.07); }
nav.tabs a[aria-current="page"] { color: var(--band-ink); background: rgba(255,255,255,.13); }
.lang { display: flex; gap: 2px; }
.lang button { font: 500 .78rem var(--mono); color: var(--band-muted); background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 4px 7px; cursor: pointer; text-transform: uppercase; }
.lang button[aria-pressed="true"] { color: var(--band-ink); border-color: var(--band-muted); }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; }
.view { max-width: 1600px; margin: 0 auto; }
.reading { max-width: 1080px; margin: 0 auto; display: grid; gap: 28px; }
.lede { font-size: 1.05rem; color: var(--muted); max-width: 70ch; margin: 6px 0 0; }

/* ---------- explorer ---------- */
/* controls on the left; map fills the rest; the target panel sits under the map */
.explore { display: grid; gap: 16px; grid-template-columns: 290px minmax(0, 1fr); align-items: start; }
.explore > .controls { grid-row: 1 / span 2; }
.explore > .detail { grid-column: 2; }
@media (min-width: 1100px) {
  .detail { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; align-items: start; }
  .detail > header, .detail > .best, .detail > .note, .detail > details.layer { grid-column: 1 / -1; }
  .detail .best { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 720px; }
}
@media (max-width: 1099px) { .explore > .controls { grid-row: auto; } .explore > .detail { grid-column: 1 / -1; } }
@media (max-width: 820px) { .explore { grid-template-columns: minmax(0, 1fr); } .explore > .detail { grid-column: auto; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 14px; min-width: 0; }
.controls .group { display: grid; gap: 6px; }
.tlist { display: grid; gap: 4px; }
.tbtn { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; text-align: left; width: 100%; padding: 8px 10px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font: inherit; }
.tbtn .dot { width: 10px; height: 10px; border-radius: 50%; grid-row: span 2; }
.tbtn small { color: var(--muted); font-size: .78rem; }
.tbtn[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
.dot.moon { background: #9a9a9a; } .dot.mars { background: var(--mars); }
.seg { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 4px; }
.seg button { font: 500 .85rem var(--body); padding: 7px 6px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: .88rem; cursor: pointer; }
.swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid; flex: none; }

.mapwrap { position: relative; min-width: 0; }
#map, #trmap { height: min(74vh, 760px); min-height: 380px; border-radius: var(--r); border: 1px solid var(--line); background: var(--sunk); }
#trmap { height: min(62vh, 620px); }
.legend { position: absolute; left: 10px; bottom: 26px; z-index: 500; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; font-size: .78rem; display: grid; gap: 4px; max-width: calc(100% - 20px); }
.ramp { height: 10px; width: 180px; max-width: 100%; border-radius: 3px; }
.ramp-l { display: flex; justify-content: space-between; font-family: var(--mono); font-size: .72rem; color: var(--muted); }
.offline { position: absolute; right: 10px; top: 10px; z-index: 500; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 9px; font-size: .76rem; color: var(--muted); max-width: 260px; }

.detail h2 { font-size: 1.45rem; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: .88rem; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; }
.best { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 480px) { .best { grid-template-columns: 1fr; } }
.stat { border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 2px; min-width: 0; }
.stat .big { font: 600 1.6rem var(--display); }
.stat .where { font-size: .85rem; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: .74rem; padding: 2px 7px; border-radius: 99px; background: var(--sunk); color: var(--ink); white-space: nowrap; }
.chip.miss { background: var(--mars-soft); color: var(--mars); }
.chip.rock { background: var(--earth-soft); color: var(--earth); }
.team { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; counter-reset: t; }
.team li { display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; align-items: start; }
.team li::before { counter-increment: t; content: counter(t); font: 600 .8rem var(--mono); width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--surface); grid-row: span 2; }
.team .nm { font-weight: 600; font-size: .9rem; }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); }
.cards4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cards4 figure { margin: 0; display: grid; gap: 4px; }
.cards4 img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; background: var(--sunk); display: block; }
.cards4 figcaption { font-size: .74rem; color: var(--muted); line-height: 1.35; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; }
td.n, th.n { text-align: right; white-space: nowrap; }
.tbl { overflow-x: auto; }
table.heat td.n { font-family: var(--mono); font-weight: 600; border-bottom: 2px solid var(--surface); }
.months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px; }
.months div { text-align: center; font-size: .66rem; padding: 6px 0 4px; border-radius: 3px; font-family: var(--mono); }
.m0 { background: #b9d3e8; color: #1d3550; } .m1 { background: var(--sunk); color: var(--muted); } .m2 { background: #b9dfc4; color: #1c4a2c; } .m3 { background: #2f7a4a; color: #fff; }
.note { font-size: .84rem; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 0; }
.note.warn { border-color: var(--warn); color: var(--ink); }
.src { font-size: .74rem; color: var(--muted); }
details.layer { border-top: 1px solid var(--line); padding-top: 10px; }
details.layer summary { cursor: pointer; font-family: var(--display); font-size: 1.02rem; font-weight: 600; }
details.layer > div { display: grid; gap: 8px; margin-top: 8px; }
.fbar { display: grid; grid-template-columns: 1fr; gap: 1px; }
.fbar span { display: block; height: 7px; border-radius: 2px; }

/* ---------- intro ---------- */
.intro { margin-bottom: 16px; gap: 12px; }
.intro .lede { margin: 0; color: var(--ink); font-size: 1.08rem; max-width: 80ch; }
.intro-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .intro-grid { grid-template-columns: minmax(0, 1fr); } }
details.more { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; background: var(--bg); min-width: 0; }
details.more > summary { cursor: pointer; font-family: var(--display); font-weight: 600; font-size: 1rem; }
details.more[open] > summary { margin-bottom: 6px; }
details.more ul, details.more ol { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 6px; font-size: .9rem; }
details.more p { font-size: .9rem; }
.controls details.more { padding: 6px 10px; }
.controls details.more > summary { font-size: .88rem; }
dl.gloss { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: .92rem; }
dl.gloss dt { font-weight: 600; } dl.gloss dd { margin: 0; }
@media (max-width: 600px) { dl.gloss { grid-template-columns: 1fr; } dl.gloss dd { margin-bottom: 6px; } }

/* ---------- reading views ---------- */
.section { display: grid; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.figs figure { margin: 0; display: grid; gap: 6px; }
.figs img { border: 1px solid var(--line); border-radius: var(--r); background: #fff; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; background: var(--surface); display: grid; gap: 4px; }
.kpi .big { font: 600 2rem var(--display); }
.kpi p { margin: 0; font-size: .84rem; color: var(--muted); }
.chartbox { position: relative; height: 300px; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 34px 1fr; gap: 0 12px; padding-bottom: 14px; position: relative; }
.steps li::before { counter-increment: s; content: counter(s); font: 600 .85rem var(--mono); width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--mars); color: var(--mars); display: grid; place-items: center; background: var(--surface); z-index: 1; }
.steps li::after { content: ""; position: absolute; left: 14px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
.steps li:last-child::after { display: none; }
.steps b { display: block; }
.srcs { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: .88rem; }
.ai { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; background: var(--surface); }
.ai ul { margin: 6px 0 0; padding-left: 20px; }
.patch { display: grid; grid-template-columns: 140px 1fr; gap: 14px; align-items: center; }
.patch-img { position: relative; }
.patch-img svg { width: 140px; height: 140px; display: block; }
@media (max-width: 480px) { .patch { grid-template-columns: 1fr; justify-items: start; } }
.badge { display: inline-block; font: 600 .68rem var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; background: var(--ink); color: var(--surface); }
.patch-img .badge { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); white-space: nowrap; }
.files { display: grid; gap: 6px; }
.files a { font-family: var(--mono); font-size: .85rem; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
footer { max-width: 1600px; margin: 0 auto; padding-top: 18px; border-top: 1px solid var(--line); font-size: .78rem; color: var(--muted); }

/* ---------- Leaflet 1.9.4 core styles (inlined) ---------- */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:var(--body);font-size:.8rem}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden;filter:inherit}.leaflet-tile-loaded{visibility:inherit}
.leaflet-container img.leaflet-tile{mix-blend-mode:plus-lighter;max-width:none!important;max-height:none!important}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-tile-pane img{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-control{position:relative;z-index:800;pointer-events:visiblePainted;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right;margin-right:10px}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-bar{box-shadow:0 1px 4px rgba(0,0,0,.3);border-radius:4px}
.leaflet-bar a{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);width:28px;height:28px;line-height:28px;display:block;text-align:center;text-decoration:none;font:600 16px var(--mono)}
.leaflet-bar a:first-child{border-radius:4px 4px 0 0}.leaflet-bar a:last-child{border-radius:0 0 4px 4px;border-bottom:none}
.leaflet-control-layers{background:var(--surface);color:var(--ink);border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.3);padding:6px 8px}
.leaflet-control-layers-toggle{display:none}.leaflet-control-layers label{display:block;font-size:.78rem}
.leaflet-control-layers-separator{border-top:1px solid var(--line);margin:4px 0}
.leaflet-control-attribution{background:rgba(255,255,255,.82);color:#333;margin:0;padding:0 5px;font-size:.66rem;line-height:1.5}
.leaflet-control-attribution a{color:#2b4a8a}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:6px;background:var(--surface);color:var(--ink);box-shadow:0 3px 14px rgba(0,0,0,.35)}
.leaflet-popup-content{margin:10px 14px;line-height:1.4;min-height:1px;font-size:.84rem}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}

.leaflet-popup-close-button{position:absolute;top:0;right:0;border:none;text-align:center;width:24px;height:24px;font:16px/24px var(--mono);color:var(--muted);text-decoration:none;background:transparent}
.leaflet-tooltip{position:absolute;padding:4px 6px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:3px;white-space:nowrap;pointer-events:none;font-size:.76rem}
/* rover */
.rv-controls { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; gap: 18px; }
.rv-controls .label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
.rv-controls .seg { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
.rv-controls .chips { margin-top: 8px; }
button.chip { border: 1px solid var(--line); cursor: pointer; font: inherit; font-size: .74rem; }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
input[type=range] { accent-color: var(--accent); }
.rv-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.rv-card { margin: 0; display: grid; gap: 6px; grid-template-rows: auto 1fr; }
#rvout { display: grid; gap: 22px; }
#rvout > .src { margin-top: -14px; }
.rv-card figcaption { display: grid; gap: 2px; }
.rv-canvas { width: 100%; aspect-ratio: 1 / 1; border: 1px solid var(--line); border-radius: var(--r); background: var(--sunk); touch-action: none; cursor: grab; display: block; }
@media (max-width: 700px) { .rv-controls { grid-template-columns: minmax(0, 1fr); } }
</style>

<header class="band">
  <div class="band-in">
    <div class="brand"><h1 lang="en">Mirror Terrain</h1><span class="split" data-i18n="band.sub">Moon · Mars · Earth</span></div>
    <nav class="tabs" aria-label="Sections">
      <a href="#explore" data-i18n="nav.explore">Explorer</a>
      <a href="#findings" data-i18n="nav.findings">Findings</a>
      <a href="#turkey" data-i18n="nav.turkey">Türkiye</a>
      <a href="#rover" data-i18n="nav.rover">Rover</a>
      <a href="#validation" data-i18n="nav.validation">Validation</a>
      <a href="#method" data-i18n="nav.method">Method &amp; data</a>
      <a href="#files" data-i18n="nav.files">Files</a>
      <a href="#about" data-i18n="nav.about">About</a>
    </nav>
    <div class="lang" role="group" aria-label="Language" id="lang"></div>
  </div>
</header>

<main>
  <div class="loading" id="loading">Loading data…</div>

  <!-- ===== Explorer ===== -->
  <section class="view" id="v-explore" hidden>
    <div class="panel intro" id="intro"></div>
    <div class="explore">
      <aside class="panel controls">
        <div class="group"><span class="eyebrow" data-i18n="ui.target">Target</span><div class="tlist" id="tlist"></div></div>
        <div class="group"><span class="eyebrow" data-i18n="ui.mode">Test purpose</span><div class="seg" id="modes"></div><p class="hint" id="modehint"></p>
          <details class="more" id="modemore"><summary data-i18n="mode.more">What does this mode mean?</summary><p id="modelong" style="margin:6px 0 0;font-size:.86rem"></p></details></div>
        <div class="group" id="dsgroup"><span class="eyebrow" data-i18n="ui.dataset">Mars elevation data</span><div class="seg" id="dsseg"></div></div>
        <div class="group checks"><span class="eyebrow" data-i18n="ui.layers">Show on map</span><div id="layerchecks"></div></div>
      </aside>
      <div class="mapwrap">
        <div id="map" role="region" aria-label="Map"></div>
        <div class="legend" id="legend"></div>
        <div class="offline" id="offline" hidden></div>
      </div>
      <article class="panel detail" id="detail"></article>
    </div>
  </section>

  <!-- ===== Türkiye ===== -->
  <section class="view" id="v-findings" hidden><div class="reading" id="findings"></div></section>
  <section class="view" id="v-turkey" hidden><div class="reading" id="turkey"></div></section>
  <section class="view" id="v-rover" hidden><div class="reading" id="roverv"></div></section>
  <section class="view" id="v-validation" hidden><div class="reading" id="validation"></div></section>
  <section class="view" id="v-method" hidden><div class="reading" id="method"></div></section>
  <section class="view" id="v-files" hidden><div class="reading" id="filesv"></div></section>
  <section class="view" id="v-about" hidden><div class="reading" id="about"></div></section>
</main>
<footer style="padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-bottom:24px" id="foot"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>

</body>
</html>
